<div class="category-picker">
  <button
    #trigger
    type="button"
    class="category-picker__trigger"
    [class.category-picker__trigger--emphasize]="emphasize()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    {{ selectedName() }}
  </button>
  @if (open() && panelPosition(); as position) {
    <div
      class="category-picker__panel"
      [style.left.px]="position.left"
      [style.width.px]="position.width"
      [style.top.px]="position.top"
      [style.bottom.px]="position.bottom"
      [style.max-height.px]="position.maxHeight"
    >
      <!-- No `autofocus`: on a scrollable ancestor (e.g. the transaction edit dialog's card),
           autofocusing this on open can trigger the browser's own scroll-into-view, which the
           document scroll listener above then reads as "the trigger moved" and closes the panel
           that just opened (issue #24). -->
      <input
        class="category-picker__filter"
        type="text"
        placeholder="Filter categories"
        [value]="filterText()"
        (input)="filterText.set($any($event.target).value)"
      />
      <ul class="category-picker__list">
        <li>
          <button type="button" class="category-picker__option" (click)="select(null)">Uncategorized</button>
        </li>
        @for (group of filteredGroups(); track group.label) {
          <li class="category-picker__group-label">{{ group.label }}</li>
          @for (option of group.options; track option.id) {
            <li>
              <button
                type="button"
                class="category-picker__option"
                [class.category-picker__option--selected]="option.id === selectedId()"
                (click)="select(option.id)"
              >
                {{ option.displayName }}
              </button>
            </li>
          }
        }
      </ul>
    </div>
  }
</div>
