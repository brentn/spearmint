<div class="category-picker">
  <button
    type="button"
    class="category-picker__trigger"
    [class.category-picker__trigger--emphasize]="emphasize()"
    [disabled]="disabled()"
    (click)="openSheet()"
  >
    {{ selectedLabel() }}
  </button>

  @if (open()) {
    <div class="category-picker__backdrop" [class.category-picker__backdrop--in]="animateIn()" (click)="close()">
      <div
        class="category-picker__sheet"
        [class.category-picker__sheet--in]="animateIn()"
        (click)="$event.stopPropagation()"
      >
        <div class="category-picker__handle"></div>
        <input
          class="category-picker__filter"
          type="text"
          placeholder="Filter categories"
          [value]="filterText()"
          (input)="filterText.set($any($event.target).value)"
        />
        <ul class="category-picker__list">
          <li>
            <button
              type="button"
              class="category-picker__option"
              [class.category-picker__option--selected]="selectedId() === null"
              (click)="select(null)"
            >
              <span>Uncategorized</span>
              @if (selectedId() === null) {
                <span class="category-picker__check">&check;</span>
              }
            </button>
          </li>
          @for (option of filteredOptions(); track option.id) {
            <li>
              <button
                type="button"
                class="category-picker__option"
                [class.category-picker__option--selected]="option.id === selectedId()"
                (click)="select(option.id)"
              >
                <span>{{ option.label }}</span>
                @if (option.id === selectedId()) {
                  <span class="category-picker__check">&check;</span>
                }
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  }
</div>
