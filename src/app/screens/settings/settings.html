<div class="settings">
  <app-settings-header title="Settings" />

  <div class="settings__content">
    <ul class="settings__list">
      <li>
        <a class="settings__link" routerLink="accounts">Accounts</a>
      </li>
      <li>
        <a class="settings__link" routerLink="categories">Categories</a>
      </li>
      <li>
        <a class="settings__link" routerLink="export-import">Export / Import backup</a>
      </li>
      <li>
        <a class="settings__link" routerLink="security">Security</a>
      </li>
    </ul>

    <section class="settings__danger-zone">
      <h2 class="settings__danger-title">Danger zone</h2>
      <p class="settings__danger-body">
        Permanently delete everything stored on this device — accounts, transactions, categories, budgets, and your device registration.
      </p>
      <button class="settings__danger-button" type="button" (click)="resetDialog.open()">Reset local data</button>
    </section>
  </div>

  <app-reset-device-dialog
    #resetDialog
    title="Reset local data?"
    body="This deletes everything stored locally on this device — accounts, transactions, categories, budgets, and your device registration. You'll need to set up Spearmint again. This can't be undone."
  />
</div>
