<div class="flow-progress">
  <app-flow-progress-bar
    [row]="progress().income"
    label="Incoming"
    [showTodayTick]="showTodayTick()"
    [todayPercent]="todayPercent()"
  />
  <app-flow-progress-bar
    [row]="progress().expenses"
    label="Outgoing"
    [showTodayTick]="showTodayTick()"
    [todayPercent]="todayPercent()"
  />
</div>
