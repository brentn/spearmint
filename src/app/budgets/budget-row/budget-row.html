<li class="budget-row" [class.budget-row--child]="indent()">
  <a class="budget-row__link" [routerLink]="['/budgets', row().id]" [queryParams]="queryParams()">
    <div class="budget-row__amount-line">
      <span class="budget-row__cat-name">{{ row().categoryName }}</span>
      <span>${{ row().spent | number: '1.0-0' }} of ${{ row().available | number: '1.0-0' }}</span>
    </div>
    <div class="bar-track" [class.bar-track--implied]="row().implied">
      <div
        [class]="'bar-fill bar-fill--' + row().state"
        [class.bar-fill--reversed]="row().reversed"
        [style.width.%]="row().barPercent * 100"
      ></div>
      @if (row().reversedCapped) {
        <div class="bar-overflow-indicator">
          <span [class]="'bar-chevron bar-chevron--' + row().state"></span>
          <span class="bar-pct">{{ row().pctRounded }}%</span>
        </div>
      } @else {
        <span
          class="bar-pct"
          [class.bar-pct--on-fill]="row().pctLabelOnFill"
          [style.left]="row().pctLabelOnFill || row().reversed ? null : row().barPercent * 100 + 4 + '%'"
          [style.right]="!row().pctLabelOnFill && row().reversed ? row().barPercent * 100 + 4 + '%' : null"
        >
          {{ row().pctRounded }}%
        </span>
      }
    </div>
  </a>
</li>
