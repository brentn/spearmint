
<div class="rotate-overlay">

</div>

<div class="app-root-content">
    @if (authService.isUnlocked()) {
        <div class="app-shell">
            <div class="app-scroll" appNavScrollContainer>
                <div class="app-content">
                    <router-outlet></router-outlet>
                </div>
            </div>
            <app-nav-shell></app-nav-shell>
        </div>
    } @else {
        <app-auth-gate></app-auth-gate>
    }
</div>
